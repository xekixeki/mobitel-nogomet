<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Popravljeni Mobilni Nogomet 1v1</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    body { background-color: #1a1a1a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    
    #lobby { position: absolute; z-index: 10; background: rgba(20, 20, 20, 0.98); padding: 25px; border-radius: 16px; text-align: center; width: 90%; max-width: 340px; border: 1px solid #444; }
    .hidden { display: none !important; }
    
    #status-messsage { color: #facc15; margin-bottom: 15px; font-weight: bold; min-height: 1.2em; }
    .code-box { font-size: 32px; font-weight: bold; background: #2a2a2a; padding: 15px; border-radius: 8px; margin: 15px 0; color: #4ade80; border: 1px solid #333; }
    input { width: 100%; padding: 12px; font-size: 18px; border-radius: 8px; border: 1px solid #444; background: #333; color: #fff; text-align: center; margin-bottom: 15px; }
    button { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; }
    
    #scoreboard { position: absolute; top: 15px; font-size: 28px; font-weight: bold; z-index: 5; display: flex; gap: 20px; background: rgba(0,0,0,0.6); padding: 8px 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); }
    .score-p1 { color: #ef4444; } /* Host */
    .score-p2 { color: #3b82f6; } /* Guest */
    
    canvas { background: #2e7d32; border: 4px solid #fff; border-radius: 12px; box-shadow: 0 0 25px rgba(0,0,0,0.8); }
  </style>
</head>
<body>

  <!-- Rezultat -->
  <div id="scoreboard" class="hidden">
    <span class="score-p1" id="score1">0</span>
    <span>:</span>
    <span class="score-p2" id="score2">0</span>
  </div>

  <!-- Ekran za povezivanje -->
  <div id="lobby">
    <h2>Nogomet 1v1</h2>
    <p id="status-messsage">Povezivanje na server...</p>
    
    <div id="host-section" class="hidden">
      <p>Igrač 1 (Host - <span style="color:#ef4444">CRVENI</span>)</p>
      <p>Daj ovaj kod prijatelju:</p>
      <div class="code-box" id="my-id">...
